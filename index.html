<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Klub Coding</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

   
    <div class="form-card">

     
        <div class="form-header">
            <span class="badge"> SMK DARUSSALAM MAKASSAR </span>
            <h2>Join coding club</h2>
            <p>Daftarkan dirimu dan mulai mulai mengasah kemampuanmu!</p>
        </div>

       
        <form>
            
            <div class="input-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="contoh: arif" required>
            </div>

            
            <div class="input-group">
                <label for="kelas">Kelas</label>
                <input type="text" id="kelas" placeholder="contoh: XI RPL" required>
            </div>

            
            <div class="input-group">
                <label for="alasan">Kenapa ingin bergabung?</label>
                <textarea id="alasan" rows="3" placeholder="Tulis alasan singkatmu di sini..." required></textarea>
            </div>

           
            <button type="submit" class="btn-submit">Kirim Pendaftaran</button>
        </form>

    </div>

</body>
</html>
